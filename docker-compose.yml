services:
  controller:
    build:
      context: .
      dockerfile: services/controller/Dockerfile
    env_file: .env
    environment:
      VOX_WORKER_URL: ${VOX_WORKER_URL:-}
      WAN_WORKER_URL: ${WAN_WORKER_URL:-}
      CUSTOM_WORKER_URL: ${CUSTOM_WORKER_URL:-}
      LOCAL_STORAGE_DIR: /shared/files
      DATABASE_URL: sqlite:////app/data/app.db
      PUBLIC_BASE_URL: http://localhost:8000
    volumes:
      - ./data/controller:/app/data
      - ./data/shared:/shared
    ports:
      - "8000:8000"

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - controller
