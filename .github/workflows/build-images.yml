name: Build GPU images

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to build
        required: true
        default: voxcpm2
        type: choice
        options:
          - voxcpm2
          - wangp
          - both
      tag:
        description: Container tag
        required: true
        default: latest
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'packages/python_common/**'
      - '.github/workflows/build-images.yml'

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [voxcpm2, wangp]
    steps:
      - name: Check selection
        id: selected
        shell: bash
        run: |
          selected="${{ github.event.inputs.image || 'both' }}"
          if [[ "$selected" == "both" || "$selected" == "${{ matrix.worker }}" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.selected.outputs.run == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.selected.outputs.run == 'true'

      - uses: docker/login-action@v3
        if: steps.selected.outputs.run == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.selected.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/${{ matrix.worker }}/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cloud-api-${{ matrix.worker }}:${{ github.event.inputs.tag || 'latest' }}
          build-args: |
            BAKE_MODEL=${{ matrix.worker == 'voxcpm2' && '1' || '0' }}
